name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- lib
      - run: npm audit --audit-level=high
  dsh-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --prefix "$RUNNER_TEMP/notion-pnpm" --no-audit --no-fund pnpm@12.16.1
      - run: echo "$RUNNER_TEMP/notion-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm install --prefix "$RUNNER_TEMP/notion-dsh" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.2
      - run: npm run test:dsh
        env:
          DSH_TEST_BINARY: ${{ runner.temp }}/notion-dsh/node_modules/.bin/dsh
          CHROME_PATH: /usr/bin/google-chrome
          DSH_TEST_LANGUAGE: zh-CN
